name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs are independent, so they run side by side instead of one after another.
jobs:
  # Builds Core, the tests and the manifest tool (warnings are errors) and runs every check.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dotnet-8

      - name: Test
        run: dotnet run --project tests/ReSkateTrainerUpdater.Tests -c Release

      - name: Build the manifest tool and check latest.json (offline, no network)
        run: dotnet run --project tools/ReSkateTrainerUpdater.ManifestTool -c Release -- check

  # Builds the portable zip and the setup program exactly as a release does, so a broken installer is caught here and
  # not on release day. The script also compiles the app (warnings are errors) and runs the exe's own self-test.
  # (GitHub's Windows images include Inno Setup.)
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dotnet-8

      - name: Build the release files
        shell: pwsh
        run: ./scripts/build-release.ps1

  # An experiment, and it can't fail the build: do the tests pass on Linux too? Linux runners start faster, so if they
  # do, the `test` job could move there. Look at this job's result before relying on it.
  linux-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dotnet-8

      - name: Test
        run: dotnet run --project tests/ReSkateTrainerUpdater.Tests -c Release
