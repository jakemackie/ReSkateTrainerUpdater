name: Release

# Push a tag such as v1.0.0 to build the exe, publish it as a GitHub release, and record it in latest.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check the tag matches the version in Directory.Build.props
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = @($props.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match version $version in Directory.Build.props"
          }

      - name: Test
        run: dotnet run --project tests/ReSkateTrainerUpdater.Tests -c Release

      # GitHub's Windows images include Inno Setup, which builds the setup program. Install it if that ever changes.
      - name: Make sure Inno Setup is installed
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (Test-Path $iscc) { Write-Host "Inno Setup found: $iscc" }
          else {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
          }

      - name: Build the release files (the portable zip and the setup program)
        shell: pwsh
        run: ./scripts/build-release.ps1

      # --latest keeps the app as the repository's "Latest release". Trainer zips are published as separate
      # releases (tags like trainer-tournament-0.9.2) that must NOT be marked latest. See docs/RELEASING.md.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $notes = "**To install it, download ReSkateTrainerUpdater-Setup-$version.exe below and run it.** It installs for you only (no administrator needed), adds a Start Menu entry, and keeps itself up to date from then on. Windows may show a blue 'Windows protected your PC' screen, because the setup isn't code-signed (that costs money, and this is a free community tool): click **More info**, then **Run anyway**. The .zip is the portable exe with no installer, and it is also what the app downloads to update itself."
          $files = @(Get-ChildItem "release/ReSkateTrainerUpdater-$version.zip") + @(Get-ChildItem "release/ReSkateTrainerUpdater-Setup-$version.exe")
          gh release create "${{ github.ref_name }}" $files --title "ReSkate Trainer Updater ${{ github.ref_name }}" --notes $notes --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }

      # Tells every installed copy of the app that this version exists, so they can update themselves with one click.
      # latest.json lives on main, so this takes main's copy, records this release in it, runs the same checks the app
      # will run (the zip must hold this version's exe, and the published zip must download and match), and only then
      # commits it. If main is protected against pushes by the workflow, this step fails after the release is already
      # published: run the manifest tool's set-app command by hand (docs/RELEASING.md).
      - name: Publish this version for self-update in latest.json
        shell: pwsh
        run: |
          git fetch origin main:refs/remotes/origin/main
          git checkout origin/main -- latest.json

          # release-note.txt (one short line, in the tagged commit) becomes the "What's new" line the app shows.
          $noteArgs = @()
          if (Test-Path release-note.txt) {
            $note = (Get-Content release-note.txt -Raw).Trim()
            if ($note) { $noteArgs = @('--notes', $note) }
          }

          $zip = (Get-ChildItem release/ReSkateTrainerUpdater-*.zip).FullName
          dotnet run --project tools/ReSkateTrainerUpdater.ManifestTool -c Release -- set-app $zip @noteArgs
          if ($LASTEXITCODE -ne 0) { throw "set-app failed" }
          dotnet run --project tools/ReSkateTrainerUpdater.ManifestTool -c Release -- verify
          if ($LASTEXITCODE -ne 0) { throw "verify failed" }

          Copy-Item latest.json "$env:RUNNER_TEMP/latest.json"
          git checkout -f -B main origin/main
          if ($LASTEXITCODE -ne 0) { throw "git checkout failed" }
          Copy-Item "$env:RUNNER_TEMP/latest.json" latest.json -Force

          git diff --quiet latest.json
          if ($LASTEXITCODE -eq 0) { Write-Host "latest.json already lists this version."; exit 0 }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Publish app ${{ github.ref_name }} for self-update"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed" }
          git push origin main
          if ($LASTEXITCODE -ne 0) { throw "git push failed. Is main protected? Run set-app by hand, see docs/RELEASING.md" }
